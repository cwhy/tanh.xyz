<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
    <!-- Red moon -->
    <path d="M 120 80 C 180 40, 240 80, 260 120 C 240 90, 180 70, 140 100 Z" fill="#ff4d4d" stroke="#2d2d2d" stroke-width="4" />
    
    <!-- Blue moon -->
    <path d="M 140 160 C 200 200, 260 160, 280 120 C 260 150, 200 170, 160 140 Z" fill="#2d5da1" stroke="#2d2d2d" stroke-width="4" />

    <!-- Red scattered dots -->
    <circle cx="110" cy="70" r="6" fill="#ff4d4d" stroke="#2d2d2d" stroke-width="2.5" />
    <circle cx="170" cy="54" r="5" fill="#ff4d4d" stroke="#2d2d2d" stroke-width="2.5" />
    <circle cx="230" cy="78" r="7" fill="#ff4d4d" stroke="#2d2d2d" stroke-width="2.5" />
    
    <!-- Blue scattered dots -->
    <circle cx="190" cy="184" r="6" fill="#2d5da1" stroke="#2d2d2d" stroke-width="2.5" />
    <circle cx="250" cy="170" r="5" fill="#2d5da1" stroke="#2d2d2d" stroke-width="2.5" />
    <circle cx="290" cy="130" r="7" fill="#2d5da1" stroke="#2d2d2d" stroke-width="2.5" />
    
    <!-- Decision boundary -->
    <path d="M 60 140 Q 200 100, 340 160" stroke="#2d2d2d" stroke-width="4" stroke-dasharray="12 8" fill="none" />
</svg>
